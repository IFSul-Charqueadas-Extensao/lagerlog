<!DOCTYPE html>
<html th:replace="~{fragments/layouts/mainLayout :: layout(~{::title}, ~{}, ~{}, ~{::body}, ~{fragments/navbar :: navEstoque})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
</head>

<body>
    

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Estoque</th>
                <th>Ponto Suprimento</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="produto : ${produtos}"
                th:classappend="(${produto.estoque < produto.pontoSuprimento} ? 
                (${produto.estoque < produto.quantidade} ? 'sem-estoque-venda' : 'baixo-estoque') : '')">
                <td th:text="${produto.descricao}"></td>
                <td th:text="${#numbers.formatDecimal(produto.estoque, 1, 'POINT', 1, 'POINT') + ' ' + produto.unidade}"></td>
                <td th:text="${#numbers.formatDecimal(produto.pontoSuprimento, 1, 'POINT', 1, 'POINT') + ' ' + produto.unidade}"></td>
                <td th:text="${produto.status == 0 ? 'Desativado' : 'Ativo'}"></td>
            </tr>
        </tbody>
    </table>

</body>

</html>
