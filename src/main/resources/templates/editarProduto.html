<!DOCTYPE html>
<html th:replace="~{fragments/layouts/mainLayout :: layout(~{::title}, ~{}, ~{}, ~{::body}, ~{fragments/navbar :: navCadastros})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar dados da mercadoria</title>
</head>

<body>
    

    <form th:object="${produto}" action="/controle/produto/editar" method="post">

        <input type="hidden" id="id" name="id" th:field="*{id}">

        <label for="descricao">Descrição: </label>
        <input type="text" id="descricao" name="descricao" th:field="*{descricao}" required>

        <label for="marca">Marca: </label>
        <input type="text" id="marca" name="marca" th:field="*{marca}" required>

        <label for="fornecedor">Fornecedor: </label>
        <input type="text" id="fornecedor" name="fornecedor" th:field="*{fornecedor}" required>

        <label for="quantidade">Quantidade de Venda: </label>
        <input type="number" id="quantidade" name="quantidade" th:field="*{quantidade}" required>
        
        <label for="unidade">Unidade de Cadastro: </label>
        <select id="unidade" name="unidade" th:field="*{unidade}" required>
            <option selected="selected" value="UN">UN</option>
            <option value="L">L</option>
        </select>

        <label for="preco">Preço: </label>
        <input type="number" id="preco" name="preco" step="0.01" th:field="*{preco}" required>

        <label for="pontoSuprimento">Ponto de Suprimento: </label>
        <input type="number" id="pontoSuprimento" name="pontoSuprimento" th:field="*{pontoSuprimento}" required>

        <label for="categoria">Categoria: </label>
        <select id="categoria" name="categoria" th:field="*{categoria}"required>
            <option selected="selected" value="COMUM">Comum</option>
            <option value="PROMOCIONAL">Promocional</option>
        </select>

        <label for="tickets">Tickets gerados: </label>
        <input type="number" id="tickets" name="tickets" min="1" th:field="*{tickets}" required>

        <fieldset>
            <legend>Produto ativo?</legend>
            <input type="radio" name="status" id="statusTrue" th:field="*{status}" value="1" th:checked="${status == 1}">
            <label for="statusTrue">Sim </label>
            <input type="radio" name="status" id="statusFalse" th:field="*{status}" value="0" th:checked="${status == 0}">
            <label for="statusFalse">Não </label>
        </fieldset>

        <input id="btnAtualizar" type="submit" value="Alterar">
    </form>
</body>

</html>
